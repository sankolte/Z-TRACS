version: '3.8'

services:
  # 1. Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ztracs-backend
    ports:
      - "5000:5000"
    environment:
      - ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_sec_2026@postgres:5432/ztracs_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:9092
      - OPENSEARCH_URL=http://opensearch:9200
      - OBJECT_STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - kafka
      - opensearch
      - minio

  # 2. PostgreSQL + PostGIS Spatial Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ztracs-postgres-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_sec_2026
      POSTGRES_DB: ztracs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Redis Hot Cache & Stream Lock Store
  redis:
    image: redis:7.2-alpine
    container_name: ztracs-redis-cache
    ports:
      - "6379:6379"

  # 4. Apache Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ztracs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # 5. Apache Kafka Event Streaming Bus
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ztracs-kafka-eventbus
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  # 6. OpenSearch License Plate & Event Engine
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ztracs-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"

  # 7. MinIO Object Storage (S3 Evidence Vault)
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: ztracs-minio-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_sec_2026
    ports:
      - "9000:9000"
      - "9001:9001"

  # 8. MediaMTX WebRTC & HLS RTSP Stream Relay Gateway
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: ztracs-mediamtx-relay
    ports:
      - "8554:8554" # RTSP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC

  # 9. Keycloak IAM & OIDC Auth Server
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ztracs-keycloak-iam
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_sec_2026
    ports:
      - "8080:8080"

  # 10. Prometheus Observability Metrics
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ztracs-prometheus
    ports:
      - "9090:9090"

  # 11. Grafana Operational Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ztracs-grafana
    ports:
      - "3001:3000"

  # 12. NGINX API Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: ztracs-nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
