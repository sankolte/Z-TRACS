# NGINX API Gateway Configuration (Z-TRACS Production Stack)

events {
    worker_connections 4096;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    upstream fastapi_backend {
        server backend:5000;
    }

    upstream mediamtx_gateway {
        server mediamtx:8554;
    }

    server {
        listen 80;
        server_name api.sdc.gujarat.gov.in ztracs.gujarat.gov.in;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.sdc.gujarat.gov.in ztracs.gujarat.gov.in;

        ssl_certificate /etc/nginx/certs/sdc_gujarat.crt;
        ssl_certificate_key /etc/nginx/certs/sdc_gujarat.key;

        # REST API Proxy
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://fastapi_backend/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Real-Time WebSocket Proxy
        location /ws/ {
            proxy_pass http://fastapi_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # MediaMTX WebRTC & HLS Stream Relay Proxy
        location /live/ {
            proxy_pass http://mediamtx_gateway/live/;
            proxy_set_header Host $host;
        }

        # Prometheus Metrics Proxy
        location /metrics {
            proxy_pass http://fastapi_backend/metrics;
        }
    }
}
