apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztracs-backend-deployment
  namespace: ztracs-production
  labels:
    app: ztracs-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ztracs-backend
  template:
    metadata:
      labels:
        app: ztracs-backend
    spec:
      containers:
      - name: ztracs-backend
        image: registry.sdc.gujarat.gov.in/ztracs/backend:v3.4.0
        ports:
        - containerPort: 5000
        env:
        - name: ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ztracs-secrets
              key: database-url
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ztracs-backend-service
  namespace: ztracs-production
spec:
  type: ClusterIP
  selector:
    app: ztracs-backend
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ztracs-ingress
  namespace: ztracs-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - ztracs.gujarat.gov.in
    secretName: ztracs-tls-cert
  rules:
  - host: ztracs.gujarat.gov.in
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: ztracs-backend-service
            port:
              number: 5000
